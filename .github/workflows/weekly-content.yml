name: Weekly Content Generation

on:
  # Run Monday and Wednesday at 8am UTC (4am EDT / 3am EST)
  schedule:
    - cron: '0 8 * * 1'  # Monday
    - cron: '0 8 * * 3'  # Wednesday
  
  # Allow manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      keyword:
        description: 'Specific keyword to write about (optional)'
        required: false
        type: string
      count:
        description: 'Number of articles to generate'
        required: false
        default: '1'
        type: string
      season:
        description: 'Force specific season'
        required: false
        type: choice
        options:
          - auto
          - spring
          - summer
          - fall
          - winter
          - evergreen
      skip_qa:
        description: 'Skip advisory style QA (the fact gate always runs)'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Dry run (no changes)'
        required: false
        default: false
        type: boolean

env:
  PYTHON_VERSION: '3.11'

jobs:
  generate-content:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Grant write permission to push commits
    permissions:
      contents: write

    # Prevent concurrent runs
    concurrency:
      group: content-generation
      cancel-in-progress: false
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Configure Git
        # Author must be a recognized identity or Vercel BLOCKS the production
        # deploy on this private repo (unrecognized "Strain Report Bot
        # <bot@strainreport.com>" commits are not deployed).
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      
      - name: Run content pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUNWARE_API_KEY: ${{ secrets.RUNWARE_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          AMAZON_AFFILIATE_TAG: ${{ secrets.AMAZON_AFFILIATE_TAG }}
          KEYWORDS_EVERYWHERE_API_KEY: ${{ secrets.KEYWORDS_EVERYWHERE_API_KEY }}
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
          NOTIFICATION_WEBHOOK_URL: ${{ secrets.NOTIFICATION_WEBHOOK_URL }}
          INPUT_KEYWORD: ${{ github.event.inputs.keyword }}
          INPUT_COUNT: ${{ github.event.inputs.count }}
          INPUT_SEASON: ${{ github.event.inputs.season }}
          INPUT_SKIP_QA: ${{ github.event.inputs.skip_qa }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          # Use "$@" so multi-word keywords stay one argument
          set -- --ci
          [ -n "$INPUT_KEYWORD" ] && set -- "$@" --keyword "$INPUT_KEYWORD"
          [ -n "$INPUT_COUNT" ] && set -- "$@" --count "$INPUT_COUNT"
          [ "$INPUT_SEASON" != "auto" ] && [ -n "$INPUT_SEASON" ] && set -- "$@" --season "$INPUT_SEASON"
          [ "$INPUT_SKIP_QA" = "true" ] && set -- "$@" --no-qa
          [ "$INPUT_DRY_RUN" = "true" ] && set -- "$@" --dry-run
          echo "Running: python weekly_content_pipeline.py $*"
          python weekly_content_pipeline.py "$@"

      # Deploy is via Vercel Git integration on push to main (auto_publish).
      # Do not add a second Vercel CLI deploy here — it races / double-deploys.

      - name: Submit new articles to IndexNow
        # auto_publish queues new article URLs in .logs/indexnow_pending.txt.
        # Wait (up to 15 min) for the Vercel deploy to serve them, then submit.
        if: success() && github.event.inputs.dry_run != 'true'
        continue-on-error: true
        run: |
          if [ -f .logs/indexnow_pending.txt ]; then
            python indexnow.py --pending --wait-live 900
          else
            echo "No new URLs queued for IndexNow."
          fi

      - name: Upload logs as artifact
        # .logs/run_reports/*.json is read by the weekly digest
        # (content-maintenance.yml); research/ and drafts/blocked/ hold the
        # evidence for every published/blocked decision.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs
          path: |
            .logs/
            research/
            drafts/blocked/
            drafts/json/
          retention-days: 30
          if-no-files-found: ignore

  # Optional: Notify on failure
  notify-failure:
    runs-on: ubuntu-latest
    needs: generate-content
    if: failure()
    
    steps:
      - name: Send failure notification
        env:
          WEBHOOK_URL: ${{ secrets.NOTIFICATION_WEBHOOK_URL }}
        run: |
          if [ -n "$WEBHOOK_URL" ]; then
            curl -X POST "$WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d '{
                "embeds": [{
                  "title": "❌ Weekly Content Pipeline Failed",
                  "description": "The automated content generation workflow failed. Check GitHub Actions for details.",
                  "color": 16711680,
                  "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"
                }]
              }'
          fi
