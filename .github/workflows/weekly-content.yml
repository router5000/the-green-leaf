name: Weekly Content Generation

on:
  # Run Monday and Wednesday at 8am UTC (3am EST / 12am PST)
  schedule:
    - cron: '0 8 * * 1'  # Monday
    - cron: '0 8 * * 3'  # Wednesday
  
  # Allow manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      keyword:
        description: 'Specific keyword to write about (optional)'
        required: false
        type: string
      count:
        description: 'Number of articles to generate'
        required: false
        default: '1'
        type: string
      season:
        description: 'Force specific season'
        required: false
        type: choice
        options:
          - auto
          - spring
          - summer
          - fall
          - winter
          - evergreen
      skip_qa:
        description: 'Skip QA evaluation (faster)'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Dry run (no changes)'
        required: false
        default: false
        type: boolean

env:
  PYTHON_VERSION: '3.11'

jobs:
  generate-content:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Grant write permission to push commits
    permissions:
      contents: write

    # Prevent concurrent runs
    concurrency:
      group: content-generation
      cancel-in-progress: false
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Configure Git
        run: |
          git config user.name "Green Leaf Bot"
          git config user.email "bot@thegreenleaf.com"
      
      - name: Run content pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUNWARE_API_KEY: ${{ secrets.RUNWARE_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          AMAZON_AFFILIATE_TAG: ${{ secrets.AMAZON_AFFILIATE_TAG }}
          KEYWORDS_EVERYWHERE_API_KEY: ${{ secrets.KEYWORDS_EVERYWHERE_API_KEY }}
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
          NOTIFICATION_WEBHOOK_URL: ${{ secrets.NOTIFICATION_WEBHOOK_URL }}
          INPUT_KEYWORD: ${{ github.event.inputs.keyword }}
          INPUT_COUNT: ${{ github.event.inputs.count }}
          INPUT_SEASON: ${{ github.event.inputs.season }}
          INPUT_SKIP_QA: ${{ github.event.inputs.skip_qa }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          ARGS="--ci"
          [ -n "$INPUT_KEYWORD" ] && ARGS="$ARGS --keyword $INPUT_KEYWORD"
          [ -n "$INPUT_COUNT" ] && ARGS="$ARGS --count $INPUT_COUNT"
          [ "$INPUT_SEASON" != "auto" ] && [ -n "$INPUT_SEASON" ] && ARGS="$ARGS --season $INPUT_SEASON"
          [ "$INPUT_SKIP_QA" = "true" ] && ARGS="$ARGS --no-qa"
          [ "$INPUT_DRY_RUN" = "true" ] && ARGS="$ARGS --dry-run"
          echo "Running: python weekly_content_pipeline.py $ARGS"
          python weekly_content_pipeline.py $ARGS
      
      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs
          path: .logs/
          retention-days: 30
          if-no-files-found: ignore

  # Optional: Notify on failure
  notify-failure:
    runs-on: ubuntu-latest
    needs: generate-content
    if: failure()
    
    steps:
      - name: Send failure notification
        env:
          WEBHOOK_URL: ${{ secrets.NOTIFICATION_WEBHOOK_URL }}
        run: |
          if [ -n "$WEBHOOK_URL" ]; then
            curl -X POST "$WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d '{
                "embeds": [{
                  "title": "❌ Weekly Content Pipeline Failed",
                  "description": "The automated content generation workflow failed. Check GitHub Actions for details.",
                  "color": 16711680,
                  "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"
                }]
              }'
          fi
